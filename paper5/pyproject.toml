[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-blood-network-paper5"
version = "0.1.0"
description = "No-fly-zone-safe, wind-energy-aware routing and station siting for emergency blood delivery in Tehran"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pulp>=2.8",
  "rasterio>=1.4",
  "shapely>=2.0",
  "pytest>=8.2",
]

[project.scripts]
paper5 = "drone_blood_network.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

